name: Run Padel Script

on:
  workflow_dispatch: # Manuelles Auslösen des Workflows
  schedule:
    - cron: "*/5 * * * *" # GitHub erlaubt höchstens alle 5 Minuten

concurrency:
  group: padel-check
  cancel-in-progress: false

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. Branch prod klonen (Code und Laufzeitdaten liegen dort; Schedule nutzt die Workflow-Datei vom Default-Branch)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: prod

      # 2. Setup von Python
      - name: Set up Python 3.10.6
        uses: actions/setup-python@v4
        with:
          python-version: "3.10.6"

      # 3. Abhängigkeiten installieren
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Skript ausführen mit Secrets
      - name: Run Python script
        env:
          MODE: cloud
          PLAYTOMIC_USERNAME: ${{ secrets.PLAYTOMIC_USERNAME }}
          PLAYTOMIC_PASSWORD: ${{ secrets.PLAYTOMIC_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUBSCRIBERS_KEY: ${{ secrets.SUBSCRIBERS_KEY }}
        run: python main.py

      # Pushe aktualisierte Slots ins Repo
      - name: Commit and Push changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add 'freie_plaetze_*.csv'
          git diff --staged --quiet || git commit -m "Update free slots via script"
          git pull --rebase
          git push
