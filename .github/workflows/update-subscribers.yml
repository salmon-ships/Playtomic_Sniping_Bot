name: Update Subscribers

on:
  workflow_dispatch: # Manuelles Auslösen, um neue /subscribe-, /unsubscribe- und /stop-Befehle zu verarbeiten

concurrency:
  group: update-subscribers
  cancel-in-progress: false

jobs:
  update-subscribers:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: prod

      - name: Set up Python 3.10.6
        uses: actions/setup-python@v4
        with:
          python-version: "3.10.6"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update subscribers
        env:
          MODE: cloud
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUBSCRIBERS_KEY: ${{ secrets.SUBSCRIBERS_KEY }}
        run: python update_subscribers.py

      - name: Commit and Push changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          [ -f subscribers.enc ] && git add subscribers.enc
          git diff --staged --quiet || git commit -m "Update subscribers via script"
          git pull --rebase
          git push
